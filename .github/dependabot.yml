version: 2

updates:
  # JavaScript/TypeScript dependencies from package.json
  # Works for Bun projects because Dependabot tracks the npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "npm"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Major updates can break Next.js, React, Fumadocs, Biome, etc.
      # Handle them manually in dedicated upgrade branches.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 3

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      github-actions:
        patterns:
          - "*"
